<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="940" height="570" fill="#ffffff"/>

  <!-- buses -->
  <line x1="245" y1="55" x2="245" y2="380" stroke="#2b5fa8" stroke-width="8"/>
  <line x1="640" y1="300" x2="640" y2="500" stroke="#2b5fa8" stroke-width="8"/>
  <text x="245" y="38" text-anchor="middle" font-weight="bold" fill="#2b5fa8">CPU bus</text>
  <text x="640" y="285" text-anchor="middle" font-weight="bold" fill="#2b5fa8">PPU bus</text>

  <!-- connections to CPU bus -->
  <g stroke="#2b5fa8" stroke-width="3">
    <line x1="180" y1="195" x2="245" y2="195"/>
    <line x1="245" y1="70"  x2="330" y2="70"/>
    <line x1="245" y1="165" x2="330" y2="165"/>
    <line x1="245" y1="260" x2="330" y2="260"/>
    <line x1="245" y1="360" x2="330" y2="360"/>
    <!-- connections to PPU bus -->
    <line x1="530" y1="385" x2="640" y2="385"/>
    <line x1="640" y1="328" x2="720" y2="328"/>
    <line x1="640" y1="400" x2="720" y2="400"/>
    <line x1="640" y1="472" x2="720" y2="472"/>
  </g>

  <!-- CPU -->
  <rect x="30" y="150" width="150" height="90" rx="6" fill="#e8f0fb" stroke="#333" stroke-width="2"/>
  <text x="105" y="190" text-anchor="middle" font-weight="bold" font-size="17">CPU</text>
  <text x="105" y="212" text-anchor="middle">6502</text>

  <!-- CPU-side devices -->
  <rect x="330" y="40" width="200" height="60" rx="6" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="430" y="66" text-anchor="middle" font-weight="bold">RAM</text>
  <text x="430" y="86" text-anchor="middle">2 KB</text>

  <rect x="330" y="130" width="200" height="70" rx="6" fill="#fdf1dc" stroke="#333" stroke-width="2"/>
  <text x="430" y="156" text-anchor="middle" font-weight="bold">Cartridge: PRG ROM</text>
  <text x="430" y="178" text-anchor="middle">+ mapper (banks, IRQ)</text>

  <rect x="330" y="230" width="200" height="60" rx="6" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="430" y="256" text-anchor="middle" font-weight="bold">Controller</text>
  <text x="430" y="276" text-anchor="middle">$4016 shift register</text>

  <!-- PPU -->
  <rect x="330" y="330" width="200" height="110" rx="6" fill="#e6f5e6" stroke="#333" stroke-width="2"/>
  <text x="430" y="372" text-anchor="middle" font-weight="bold" font-size="17">PPU</text>
  <text x="430" y="394" text-anchor="middle">registers $2000-$2007</text>
  <text x="430" y="414" text-anchor="middle">scanline renderer</text>

  <!-- PPU-side devices -->
  <rect x="720" y="300" width="200" height="56" rx="6" fill="#fdf1dc" stroke="#333" stroke-width="2"/>
  <text x="820" y="324" text-anchor="middle" font-weight="bold">Cartridge: CHR</text>
  <text x="820" y="344" text-anchor="middle">tiles (ROM or RAM)</text>

  <rect x="720" y="372" width="200" height="56" rx="6" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="820" y="396" text-anchor="middle" font-weight="bold">Nametable VRAM</text>
  <text x="820" y="416" text-anchor="middle">2 KB</text>

  <rect x="720" y="444" width="200" height="56" rx="6" fill="#f3f3f3" stroke="#333" stroke-width="2"/>
  <text x="820" y="468" text-anchor="middle" font-weight="bold">Palette + OAM</text>
  <text x="820" y="488" text-anchor="middle">colors, 64 sprites</text>

  <!-- screen -->
  <line x1="430" y1="440" x2="430" y2="487" stroke="#333" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="330" y="490" width="200" height="56" rx="6" fill="#e8f0fb" stroke="#333" stroke-width="2"/>
  <text x="430" y="514" text-anchor="middle" font-weight="bold">Screen</text>
  <text x="430" y="534" text-anchor="middle">256 x 240</text>

  <!-- NMI: PPU -> CPU -->
  <path d="M330 420 H105 V243" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="115" y="438" fill="#c0392b" font-weight="bold">NMI (vblank)</text>

  <!-- mapper control: cartridge PRG side -> CHR side -->
  <path d="M530 165 H820 V298" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#a)"/>
  <text x="560" y="155" fill="#666">bank switching, mirroring</text>
</svg>
